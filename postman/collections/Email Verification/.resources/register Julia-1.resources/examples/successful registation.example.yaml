$kind: http-example
request:
  url: "{{base}}/auth/register/"
  method: POST
  body:
    type: formdata
    content:
      - type: text
        key: username
        value: Julia
      - type: text
        key: password
        value: 123456$ABc
      - type: text
        key: password_confirmation
        value: 123456$ABc
      - type: text
        key: email
        value: julia.love2809@gmail.com
response:
  statusCode: 201
  statusText: Created
  headers:
    Date: Fri, 27 Nov 2026 21:27:15 GMT
    Server: WSGIServer/0.2 CPython/3.12.10
    Content-Type: application/json
    Vary: Accept, origin
    Allow: POST, OPTIONS
    X-Frame-Options: DENY
    Content-Length: "86"
    X-Content-Type-Options: nosniff
    Referrer-Policy: same-origin
    Cross-Origin-Opener-Policy: same-origin
  body:
    type: json
    content: |-
      {
        "username": "Julia",
        "first_name": "",
        "last_name": "",
        "email": "julia.love2809@gmail.com"
