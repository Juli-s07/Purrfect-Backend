$kind: http-example
request:
  url: "{{base}}/auth/verify-email/"
  method: POST
  body:
    type: formdata
    content:
      - type: text
        key: email
        value: julia.love2809@gmail.com
        disabled: false
      - type: text
        key: code
        value: "115588"
        disabled: false
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Date: Sat, 28 Nov 2026 11:46:54 GMT
    Server: WSGIServer/0.2 CPython/3.12.10
    Content-Type: application/json
    Vary: Accept, origin
    Allow: POST, OPTIONS
    X-Frame-Options: DENY
    Content-Length: "84"
    X-Content-Type-Options: nosniff
    Referrer-Policy: same-origin
    Cross-Origin-Opener-Policy: same-origin
  body:
    type: json
    content: |-
      {
        "message": "Validation error",
        "errors": {
          "code": "Incorrect code. Attempts left: 4."
        }
      }
order: 5000
