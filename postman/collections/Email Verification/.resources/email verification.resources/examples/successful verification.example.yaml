$kind: http-example
request:
  url: "{{base}}/auth/verify-email/"
  method: POST
  body:
    type: formdata
    content:
      - type: text
        key: email
        value: julia.love2809@gmail.com
        disabled: false
      - type: text
        key: code
        value: "458565"
        disabled: false
response:
  statusCode: 200
  statusText: OK
  headers:
    Date: Fri, 27 Nov 2026 23:29:21 GMT
    Server: WSGIServer/0.2 CPython/3.12.10
    Content-Type: application/json
    Vary: Accept, origin
    Allow: POST, OPTIONS
    X-Frame-Options: DENY
    Content-Length: "27"
    X-Content-Type-Options: nosniff
    Referrer-Policy: same-origin
    Cross-Origin-Opener-Policy: same-origin
  body:
    type: json
    content: |-
      {
        "detail": "Email verified"
      }
order: 2000
