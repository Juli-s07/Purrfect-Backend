$kind: http-example
request:
  url: "{{base}}/auth/login/"
  method: POST
  body:
    type: formdata
    content:
      - type: text
        key: username
        value: user123
        description: ""
        disabled: false
      - type: text
        key: password
        value: 123456$ABc
        description: ""
        disabled: false
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Date: Sat, 28 Nov 2026 10:50:57 GMT
    Server: WSGIServer/0.2 CPython/3.12.10
    Content-Type: application/json
    WWW-Authenticate: Bearer realm="api"
    Vary: Accept, origin
    Allow: POST, OPTIONS
    X-Frame-Options: DENY
    Content-Length: "64"
    X-Content-Type-Options: nosniff
    Referrer-Policy: same-origin
    Cross-Origin-Opener-Policy: same-origin
  body:
    type: json
    content: |-
      {
        "message": "No active account found with the given credentials"
      }
order: 1000
